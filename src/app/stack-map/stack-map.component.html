@if (this.needsMap) {
<div class="map-area">
  @if (hasMessage(result)) {
  <div>{{ result.message }}</div>
  } @else {
  <div>{{ this.locationMessage }}</div>
  }
  <div class="stack-map-container">
    <img [src]="floorMapSrc" #floorMap />
    <canvas #overlay width="1200" height="704"></canvas>
  </div>
</div>
}
