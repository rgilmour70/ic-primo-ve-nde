<div class="ic-collection-block">
  <a [href]="collectionUrl">
    <h2>{{ collectionName }}</h2>
    <p>{{ collectionDescription }}</p>
  </a>
  <custom-collection-thumbnail
    [collectionName]="hostComponent?.collection?.name"
    [collectionId]="hostComponent?.collection?.pid?.value"
  >
  </custom-collection-thumbnail>
</div>
